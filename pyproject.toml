[tool.black]
line-length = 88
target-version = ["py314"]
exclude = '''
/(
    \.git
  | \.venv
  | migrations
  | staticfiles
)/
'''

[tool.ruff]
line-length = 88
exclude = [
    ".git",
    ".venv",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "F",
    "I",
]

ignore = [
    "E501",
]